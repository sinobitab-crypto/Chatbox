<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>HATIM College Chatbot</title>
  <link rel="icon" type="image/png" id="favicon">
  <style>
    :root {
      --bg: #faf9f5;
      --sidebar: #f0eee6;
      --surface: #ffffff;
      --bubble: #ebe8dd;
      --text: #1f1e1d;
      --muted: #6b6a64;
      --line: #e3e0d5;
      --hover: rgba(31, 30, 29, 0.06);
      --accent: #c6613f;
      --accent-ink: #ffffff;
      --danger: #b3261e;
      --shadow: 0 2px 14px rgba(31, 30, 29, 0.07);
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sidebar-w: 268px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #262624;
        --sidebar: #1f1e1d;
        --surface: #30302e;
        --bubble: #3a3936;
        --text: #f0efea;
        --muted: #a3a29a;
        --line: #3d3c39;
        --hover: rgba(240, 239, 234, 0.08);
        --accent: #d97757;
        --danger: #f2b8b5;
        --shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      margin-left: calc(var(--sidebar-w) * -1);
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 14px 10px 12px;
      transition: margin-left 0.25s ease, transform 0.25s ease;
      z-index: 20;
    }
    .app.sb-open .sidebar { margin-left: 0; }

    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px 14px;
      font-family: var(--serif);
      font-size: 20px;
      letter-spacing: 0.01em;
    }
    .mark { color: var(--accent); display: inline-flex; flex-shrink: 0; }
    .mark img { display: block; width: auto; }

    .new-chat {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 15px;
    }
    .new-chat .plus {
      display: grid; place-items: center;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--accent); color: var(--accent-ink);
    }
    .new-chat:hover { background: var(--hover); }

    .sb-scroll { flex: 1; overflow-y: auto; margin-top: 10px; }
    .sb-label { padding: 12px 10px 6px; font-size: 13px; color: var(--muted); }
    .sb-list { list-style: none; }
    .sb-list button {
      width: 100%; text-align: left;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 14.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sb-list button:hover { background: var(--hover); }
    .sb-list button[aria-current="true"] { background: var(--hover); font-weight: 500; }
    .sb-empty { padding: 4px 10px; font-size: 13.5px; color: var(--muted); }
    .sb-foot { padding: 10px 10px 2px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }

    .scrim { display: none; }

    /* ---------- Main ---------- */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    .topbar {
      display: flex; align-items: center; gap: 8px;
      height: 52px; padding: 0 12px;
      flex-shrink: 0;
    }
    .icon-btn {
      display: grid; place-items: center;
      width: 36px; height: 36px; border-radius: 8px;
      color: var(--muted);
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .chat-title {
      font-size: 15px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .scroll { flex: 1; overflow-y: auto; }
    .thread {
      width: 100%; max-width: 760px;
      margin: 0 auto; padding: 8px 20px 24px;
      display: flex; flex-direction: column; gap: 22px;
    }

    /* Empty state */
    .hero { text-align: center; padding: 12vh 0 0; }
    .hero .mark { margin-bottom: 14px; }
    .hero h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(28px, 5vw, 38px);
      line-height: 1.2;
    }
    .hero p { margin-top: 8px; color: var(--muted); }
    .chips { margin-top: 28px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .chip {
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-size: 14.5px;
    }
    .chip:hover { background: var(--hover); }

    /* Messages */
    .msg.user { display: flex; justify-content: flex-end; }
    .bubble {
      max-width: 82%;
      padding: 10px 16px;
      background: var(--bubble);
      border-radius: 18px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .msg.bot { display: flex; gap: 12px; align-items: flex-start; }
    .msg.bot .mark { margin-top: 3px; }
    .prose {
      flex: 1; min-width: 0;
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
    .prose > *:first-child { margin-top: 0; }
    .prose p { margin: 0 0 0.85em; }
    .prose > *:last-child { margin-bottom: 0; }
    .prose ul, .prose ol { margin: 0 0 0.85em 1.4em; }
    .prose li { margin: 0.2em 0; }
    .prose h1, .prose h2, .prose h3, .prose h4 {
      font-family: var(--sans); font-weight: 600; line-height: 1.3; margin: 1.1em 0 0.4em;
    }
    .prose h1 { font-size: 1.3em; } .prose h2 { font-size: 1.15em; } .prose h3, .prose h4 { font-size: 1.02em; }
    .prose a { color: var(--accent); }
    .prose code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.88em; background: var(--bubble); padding: 0.1em 0.35em; border-radius: 5px;
    }
    .prose.error { color: var(--danger); font-family: var(--sans); font-size: 15px; }

    .table-wrap {
      overflow-x: auto; margin: 0.4em 0 1em;
      border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    }
    .prose table { border-collapse: collapse; width: 100%; font-family: var(--sans); font-size: 14.5px; line-height: 1.45; }
    .prose th, .prose td { padding: 9px 14px; text-align: left; white-space: nowrap; }
    .prose th { font-weight: 600; background: var(--sidebar); border-bottom: 1px solid var(--line); }
    .prose td { border-bottom: 1px solid var(--line); }
    .prose tr:last-child td { border-bottom: none; }

    /* Thinking indicator */
    .dots { display: inline-flex; gap: 5px; padding-top: 9px; }
    .dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .dots span { animation: none; opacity: 0.6; }
      .sidebar { transition: none; }
    }

    /* Composer */
    .composer-wrap { flex-shrink: 0; padding: 0 16px 12px; }
    .composer {
      max-width: 760px; margin: 0 auto;
      display: flex; align-items: flex-end; gap: 8px;
      padding: 10px 10px 10px 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .composer:focus-within { border-color: var(--muted); }
    .composer textarea {
      flex: 1; resize: none; border: none; outline: none;
      background: transparent; color: var(--text);
      font: inherit; line-height: 1.5;
      max-height: 200px; padding: 6px 0;
    }
    .composer textarea::placeholder { color: var(--muted); }
    .send {
      display: grid; place-items: center;
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent); color: var(--accent-ink);
    }
    .send:disabled { opacity: 0.35; cursor: not-allowed; }
    .fineprint { max-width: 760px; margin: 8px auto 0; text-align: center; font-size: 12.5px; color: var(--muted); }

    /* ---------- Voice ---------- */
    .topbar .push { margin-left: auto; }
    .icon-btn[aria-pressed="true"] { color: var(--accent); }
    .mic {
      display: grid; place-items: center;
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      color: var(--muted);
    }
    .mic:hover { background: var(--hover); color: var(--text); }
    .mic[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
    .mic.listening { animation: ring 1.4s infinite ease-out; }
    @keyframes ring {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); }
      100% { box-shadow: 0 0 0 12px transparent; }
    }
    @media (prefers-reduced-motion: reduce) { .mic.listening { animation: none; } }

    /* ---------- Small screens ---------- */
    @media (max-width: 800px) {
      .sidebar {
        position: fixed; inset: 0 auto 0 0;
        margin-left: 0; transform: translateX(-100%);
        box-shadow: var(--shadow);
      }
      .app.sb-open .sidebar { transform: none; }
      .app.sb-open .scrim {
        display: block; position: fixed; inset: 0; z-index: 10;
        background: rgba(0, 0, 0, 0.35);
      }
      .thread { padding: 8px 14px 20px; }
      .bubble { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">

    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="brand">
        <span class="mark" id="brandMark" aria-hidden="true"></span>
        HATIM
      </div>

      <button class="new-chat" id="newChat" type="button">
        <span class="plus" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </span>
        New chat
      </button>

      <div class="sb-scroll">
        <p class="sb-label">Ask about</p>
        <ul class="sb-list" id="topics">
          <li><button type="button" data-q="What courses does HATIM offer?">Courses</button></li>
          <li><button type="button" data-q="What is the fee structure?">Fee structure</button></li>
          <li><button type="button" data-q="Who are the faculty members?">Faculty</button></li>
          <li><button type="button" data-q="Show the academic calendar.">Academic calendar</button></li>
          <li><button type="button" data-q="What are the latest notices?">Notices</button></li>
          <li><button type="button" data-q="How can I contact the college?">Contact us</button></li>
        </ul>

        <p class="sb-label">Recents</p>
        <ul class="sb-list" id="recents"></ul>
      </div>

      <p class="sb-foot">IVY answers only from the HATIM database.</p>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="toggleSidebar" type="button" aria-label="Toggle sidebar" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
        </button>
        <span class="chat-title" id="chatTitle">New chat</span>
      </header>

      <div class="scroll" id="scroll">
        <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="userInput" rows="1" placeholder="Ask about courses, fees, admissions…" aria-label="Message"></textarea>
          <button class="mic" id="micBtn" type="button" aria-pressed="false" aria-label="Start voice chat" title="Voice chat">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button class="send" id="sendBtn" type="button" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
          </button>
        </div>
        <p class="fineprint">IVY can make mistakes. Confirm important details with the college office.</p>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

    const mark = (size) => '<img src="' + LOGO_SRC + '" height="' + size + '" alt="" aria-hidden="true">';
    document.getElementById("favicon").href = LOGO_SRC;
    document.getElementById("brandMark").innerHTML = mark(32);

    let busy = false;
    let sessionId = readStore("chat_session_id") || newId();
    writeStore("chat_session_id", sessionId);

    /* ---------- storage helpers ---------- */
    function readStore(key) { try { return localStorage.getItem(key); } catch { return null; } }
    function writeStore(key, value) { try { localStorage.setItem(key, value); } catch {} }
    function newId() { return crypto.randomUUID(); }

    function getRecents() {
      try { return JSON.parse(readStore("hatim_recents") || "[]"); } catch { return []; }
    }
    function saveRecents(list) { writeStore("hatim_recents", JSON.stringify(list.slice(0, 30))); }
    function addRecent(id, title) {
      const list = getRecents();
      if (list.some(r => r.id === id)) return;
      list.unshift({ id, title: title.slice(0, 60) });
      saveRecents(list);
      renderRecents();
    }

    /* ---------- markdown ---------- */
    DOMPurify.addHook("afterSanitizeAttributes", (node) => {
      if (node.tagName === "A") {
        node.setAttribute("target", "_blank");
        node.setAttribute("rel", "noopener noreferrer");
      }
    });

    function renderMarkdown(text) {
      const box = document.createElement("div");
      box.innerHTML = DOMPurify.sanitize(marked.parse(text || ""));
      box.querySelectorAll("table").forEach((table) => {
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        table.replaceWith(wrap);
        wrap.appendChild(table);
      });
      return box;
    }

    /* ---------- thread ---------- */
    function scrollToBottom() {
      scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" });
    }

    function clearHero() {
      const hero = thread.querySelector(".hero");
      if (hero) hero.remove();
    }

    function showHero() {
      thread.innerHTML = "";
      chatTitle.textContent = "New chat";
      const hero = document.createElement("div");
      hero.className = "hero";
      hero.innerHTML =
        '<span class="mark">' + mark(96) + '</span>' +
        '<h1>How can I help you today?</h1>' +
        '<p>I\u2019m IVY, the HATIM College assistant.</p>';
      const chips = document.createElement("div");
      chips.className = "chips";
      [
        ["Courses offered", "What courses does HATIM offer?"],
        ["Fee structure", "What is the fee structure?"],
        ["Admission criteria", "What are the admission criteria?"],
        ["Bus fares", "What are the bus fares?"],
        ["Contact the college", "How can I contact the college?"],
      ].forEach(([label, question]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = label;
        b.addEventListener("click", () => send(question));
        chips.appendChild(b);
      });
      hero.appendChild(chips);
      thread.appendChild(hero);
    }

    function addUser(text) {
      const row = document.createElement("div");
      row.className = "msg user";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text; // plain text only
      row.appendChild(bubble);
      thread.appendChild(row);
      scrollToBottom();
    }

    function botRow() {
      const row = document.createElement("div");
      row.className = "msg bot";
      const m = document.createElement("span");
      m.className = "mark";
      m.innerHTML = mark(28);
      const prose = document.createElement("div");
      prose.className = "prose";
      row.append(m, prose);
      thread.appendChild(row);
      return { row, prose };
    }

    function addBot(text, { isError = false } = {}) {
      const { row, prose } = botRow();
      if (isError) {
        prose.classList.add("error");
        prose.textContent = text;
      } else {
        prose.replaceChildren(...renderMarkdown(text).childNodes);
      }
      scrollToBottom();
      return row;
    }

    function addThinking() {
      const { row, prose } = botRow();
      prose.innerHTML = '<span class="dots" role="status" aria-label="IVY is thinking"><span></span><span></span><span></span></span>';
      scrollToBottom();
      return row;
    }

    /* ---------- sending ---------- */
    function updateSendState() {
      sendBtn.disabled = busy || !input.value.trim();
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 200) + "px";
    }

    async function send(text) {
      text = (text ?? input.value).trim();
      if (!text || busy) return;

      stopRecognition();
      input.value = "";
      autosize();
      clearHero();
      addUser(text);
      addRecent(sessionId, text);
      if (chatTitle.textContent === "New chat") chatTitle.textContent = text.slice(0, 60);
      if (mobileQuery.matches) setSidebar(false);

      const sid = sessionId;
      const thinking = addThinking();
      busy = true;
      updateSendState();

      try {
        const response = await fetch(CHAT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sid, message: text }),
        });
        if (!response.ok) throw new Error("Server returned " + response.status);
        const data = await response.json();
        thinking.remove();
        if (sid === sessionId) {
          addBot(data.reply);
          if (voiceMode) setTimeout(startListening, 300);   // keep listening for the next question
        }
      } catch (err) {
        console.error("Chat request failed:", err);
        thinking.remove();
        stopVoice();
        if (sid === sessionId) {
          addBot("I couldn\u2019t reach the server. Make sure the backend is running, then try again.", { isError: true });
        }
      } finally {
        busy = false;
        updateSendState();
        input.focus();
      }
    }

    /* ---------- chats ---------- */
    function renderRecents() {
      const list = getRecents();
      recentsEl.innerHTML = "";
      if (!list.length) {
        const li = document.createElement("li");
        li.className = "sb-empty";
        li.textContent = "Your chats will show up here.";
        recentsEl.appendChild(li);
        return;
      }
      list.forEach((r) => {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = r.title;
        b.title = r.title;
        if (r.id === sessionId) b.setAttribute("aria-current", "true");
        b.addEventListener("click", () => openChat(r.id, r.title));
        li.appendChild(b);
        recentsEl.appendChild(li);
      });
    }

    function startNewChat() {
      stopVoice();
      sessionId = newId();
      writeStore("chat_session_id", sessionId);
      showHero();
      renderRecents();
      if (mobileQuery.matches) setSidebar(false);
      input.focus();
    }

    async function openChat(id, title) {
      stopVoice();
      sessionId = id;
      writeStore("chat_session_id", id);
      renderRecents();
      if (mobileQuery.matches) setSidebar(false);
      await loadHistory(id, title);
    }

    async function loadHistory(id, title) {
      try {
        const response = await fetch(HISTORY_URL + encodeURIComponent(id));
        if (!response.ok) throw new Error("Server returned " + response.status);
        const rows = await response.json();
        if (id !== sessionId) return;
        if (!Array.isArray(rows) || !rows.length) { showHero(); return; }

        thread.innerHTML = "";
        const firstUser = rows.find((r) => r.sender === "user");
        chatTitle.textContent = title || (firstUser ? firstUser.message.slice(0, 60) : "Chat");
        rows.forEach((r) => (r.sender === "user" ? addUser(r.message) : addBot(r.message)));
        if (firstUser) addRecent(id, firstUser.message);
        scroller.scrollTop = scroller.scrollHeight;
      } catch (err) {
        console.error("Could not load history:", err);
        if (id === sessionId) showHero();
      }
    }

    /* ---------- sidebar ---------- */
    function setSidebar(open) { app.classList.toggle("sb-open", open); }

    document.getElementById("toggleSidebar").addEventListener("click", () => {
      setSidebar(!app.classList.contains("sb-open"));
    });
    document.getElementById("scrim").addEventListener("click", () => setSidebar(false));
    document.getElementById("newChat").addEventListener("click", startNewChat);
    document.querySelectorAll("#topics button").forEach((b) => {
      b.addEventListener("click", () => send(b.dataset.q));
    });
    mobileQuery.addEventListener("change", (e) => setSidebar(!e.matches));

    /* ---------- composer ---------- */
    sendBtn.addEventListener("click", () => send());
    input.addEventListener("input", () => { autosize(); updateSendState(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        send();
      }
    });

    /* ---------- voice chat ---------- */
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const VOICE_LANG = "en-IN";           // change to e.g. "en-US" or "hi-IN" if needed
    const micBtn = document.getElementById("micBtn");
    const DEFAULT_PLACEHOLDER = input.placeholder;

    let voiceMode = false;    // hands-free loop: listen -> send -> show reply -> listen
    let listening = false;
    let recog = null;
    let heard = "";
    let idleCount = 0;

    function setVoiceUI() {
      micBtn.setAttribute("aria-pressed", String(voiceMode));
      micBtn.setAttribute("aria-label", voiceMode ? "Stop voice chat" : "Start voice chat");
      micBtn.title = voiceMode ? "Stop voice chat" : "Voice chat";
      micBtn.classList.toggle("listening", listening);
      input.placeholder = listening ? "Listening\u2026" : DEFAULT_PLACEHOLDER;
    }

    function voiceError(msg) {
      clearHero();
      addBot(msg, { isError: true });
    }

    /* speech -> text */
    function startListening() {
      if (!voiceMode || listening || busy) return;
      recog = new SpeechRec();
      recog.lang = VOICE_LANG;
      recog.interimResults = true;
      recog.continuous = false;
      heard = "";

      recog.onstart = () => { listening = true; setVoiceUI(); };
      recog.onresult = (e) => {
        let t = "";
        for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
        heard = t;
        input.value = t;
        autosize();
        updateSendState();
      };
      recog.onerror = (e) => {
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          stopVoice();
          voiceError("Microphone access is blocked. Allow the microphone for this page in your browser, then try again.");
        } else if (e.error === "audio-capture") {
          stopVoice();
          voiceError("No microphone was found on this device.");
        }
        // "no-speech" / "aborted" fall through to onend
      };
      recog.onend = () => {
        listening = false;
        recog = null;
        const text = heard.trim();
        heard = "";
        setVoiceUI();
        if (!voiceMode) return;
        if (text) {
          idleCount = 0;
          send(text);
        } else if (++idleCount >= 2) {
          stopVoice();   // nobody is talking; stop instead of listening forever
        } else {
          setTimeout(startListening, 200);
        }
      };
      try { recog.start(); } catch (err) { console.error(err); }
    }

    function stopRecognition() {
      if (recog && listening) { heard = ""; try { recog.abort(); } catch {} }
    }

    function stopVoice() {
      voiceMode = false;
      idleCount = 0;
      stopRecognition();
      setVoiceUI();
    }

    micBtn.addEventListener("click", () => {
      if (voiceMode) { stopVoice(); return; }
      if (!SpeechRec) {
        voiceError("Voice input isn\u2019t supported in this browser. Please use Chrome, Edge or Safari.");
        return;
      }
      voiceMode = true;
      idleCount = 0;
      setVoiceUI();
      startListening();
    });

    setVoiceUI();

    /* ---------- init ---------- */
    setSidebar(!mobileQuery.matches);
    renderRecents();
    showHero();
    loadHistory(sessionId);
    input.focus();
  </script>
</body>
</html>
